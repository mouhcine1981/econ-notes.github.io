---
layout: default
---
<article>
  <div class="wrap">
    <header class="page-header">
      {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
      <h1 class="page-title">{{ page.title }}</h1>
    </header>

    <div class="page-content">
      {{ content }}
    </div>
  </div>
</article>
