---
layout: default
---
<article>
  <div class="wrap">
    <header class="post-header">
      <span class="eyebrow">
        {{ page.date | date: '%B %-d, %Y' }}
        {% if page.tags.size > 0 %} &middot; {{ page.tags | join: ' / ' }}{% endif %}
      </span>
      <h1 class="post-title">{{ page.title }}</h1>
    </header>

    <div class="post-content">
      {{ content }}
    </div>

    <p class="meta">
      <a href="{{ '/' | relative_url }}">&larr; Back to all updates</a>
    </p>
  </div>
</article>
